<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pollme.live</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Montserrat', system-ui, sans-serif; background: #f3eee4; color: #141210; }
    .card { background: #fffdf9; border: 1px solid #e6dfd0; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>
  <script>
    const API = window.location.origin;
    let state = {
      view: 'home',
      hostCode: localStorage.getItem('hostCode') || '',
      branding: JSON.parse(localStorage.getItem('branding') || '{"name":"pollme.live","primary":"#1e3a5f","logo":""}'),
      questions: [],
      live: null,
      statusMsg: ''
    };

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function saveLocal() {
      localStorage.setItem('hostCode', state.hostCode);
      localStorage.setItem('branding', JSON.stringify(state.branding));
    }

    async function loadQuestions() {
      if (!state.hostCode) return;
      try { state.questions = await api(`/api/host/${state.hostCode}/questions`); }
      catch { state.questions = []; }
    }

    function qrSrc(text) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(text)}`;
    }

    function getDominantColor(imgSrc, callback) {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 50; canvas.height = 50;
        ctx.drawImage(img, 0, 0, 50, 50);
        const data = ctx.getImageData(0, 0, 50, 50).data;
        const colors = {};
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 128 || (r > 240 && g > 240 && b > 240) || (r < 15 && g < 15 && b < 15)) continue;
          const key = `${Math.round(r/16)*16},${Math.round(g/16)*16},${Math.round(b/16)*16}`;
          colors[key] = (colors[key] || 0) + 1;
        }
        let max = 0, best = '30,58,95';
        for (const [k, v] of Object.entries(colors)) if (v > max) { max = v; best = k; }
        const [r,g,b] = best.split(',').map(Number);
        callback('#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join(''));
      };
      img.onerror = () => callback(state.branding.primary);
      img.src = imgSrc;
    }

    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2,'0')}`;
    }

    function render() {
      const app = document.getElementById('app');
      const primary = state.branding.primary || '#1e3a5f';
      const name = state.branding.name || 'pollme.live';
      const joinUrl = `${window.location.origin}/?join=${state.hostCode}`;
      const qr = qrSrc(joinUrl);

      if (state.view === 'home') {
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-8">
            <div class="text-center max-w-3xl w-full">
              <h1 class="text-5xl font-bold mb-2" style="color:${primary}">pollme.live</h1>
              <p class="text-xl text-stone-600 mb-10">Ask questions. See the room answer. No log-in needed.</p>
              <div class="grid md:grid-cols-3 gap-6 mb-10 text-left">
                <div class="card rounded-2xl p-6">
                  <div class="text-3xl font-bold mb-2" style="color:${primary}">1</div>
                  <h3 class="font-semibold text-lg mb-1">Ask questions</h3>
                  <p class="text-sm text-stone-600">From the host desk, choose or create a question and start the clock.</p>
                </div>
                <div class="card rounded-2xl p-6">
                  <div class="text-3xl font-bold mb-2" style="color:${primary}">2</div>
                  <h3 class="font-semibold text-lg mb-1">See the room answer</h3>
                  <p class="text-sm text-stone-600">Results appear live on the projector as people respond.</p>
                </div>
                <div class="card rounded-2xl p-6">
                  <div class="text-3xl font-bold mb-2" style="color:${primary}">3</div>
                  <h3 class="font-semibold text-lg mb-1">No log-in needed</h3>
                  <p class="text-sm text-stone-600">Everyone scans the code and answers on their phone. No accounts.</p>
                </div>
              </div>
              <div class="space-y-3 max-w-sm mx-auto">
                <button onclick="startHost()" class="w-full py-3.5 rounded-xl text-white font-semibold" style="background:${primary}">Host a room</button>
                <button onclick="joinAudience()" class="w-full py-3.5 rounded-xl border-2 font-semibold" style="border-color:${primary};color:${primary}">Join with code</button>
              </div>
            </div>
          </div>`;
      } else if (state.view === 'host') {
        app.innerHTML = `
          <div class="min-h-screen p-6 max-w-6xl mx-auto">
            <header class="flex items-center justify-between mb-8">
              <div class="flex items-center gap-3">
                ${state.branding.logo ? `<img src="${state.branding.logo}" class="h-10 object-contain" />` : ''}
                <div>
                  <h1 class="text-xl font-bold" style="color:${primary}">${name}</h1>
                  <p class="text-xs text-stone-500">Host code <span class="font-mono font-bold">${state.hostCode}</span></p>
                </div>
              </div>
              <div class="flex gap-2">
                <button onclick="openProjector()" class="px-4 py-2 rounded-lg bg-stone-200 text-sm">Open projector</button>
                <button onclick="editBranding()" class="px-4 py-2 rounded-lg text-white text-sm" style="background:${primary}">Branding</button>
              </div>
            </header>
            <div class="grid lg:grid-cols-2 gap-6">
              <section class="card rounded-2xl p-6">
                <div class="flex justify-between items-center mb-4">
                  <h2 class="font-semibold uppercase tracking-wide text-sm text-stone-500">Library</h2>
                  <span class="text-xs text-stone-400">${state.questions.length} ready</span>
                </div>
                <div class="space-y-3 mb-6">${renderQList()}</div>
                ${state.statusMsg ? `<p class="text-sm font-medium text-green-700 mb-4">${state.statusMsg}</p>` : ''}
                <h3 class="font-semibold text-sm mb-3">Add to the library</h3>
                <button onclick="addQuestion()" class="px-4 py-2 rounded-lg text-white text-sm" style="background:${primary}">+ New question</button>
              </section>
              <section class="card rounded-2xl p-6">
                <h2 class="font-semibold uppercase tracking-wide text-sm text-stone-500 mb-4">On screen</h2>
                ${state.live && state.live.active ? `
                  <div class="text-2xl font-bold mb-2">${state.live.question}</div>
                  <div class="text-lg text-stone-600 mb-4">${fmtTime(state.live.remaining)}</div>
                  <div class="space-y-2">${renderResults(state.live)}</div>
                ` : `<p class="text-stone-500">No question on screen.</p>`}
                <div class="mt-6 text-center">
                  <p class="text-xs text-stone-500 mb-2">Scan to answer</p>
                  <img src="${qr}" class="mx-auto rounded" width="140" height="140" alt="QR" />
                </div>
              </section>
            </div>
          </div>`;
        startPolling();
      } else if (state.view === 'projector') {
        const liveHtml = state.live && state.live.active
          ? `<div class="text-4xl md:text-5xl font-bold mb-4">${state.live.question}</div>
             <div class="text-3xl font-medium mb-8">${fmtTime(state.live.remaining)}</div>
             <div class="w-full max-w-xl space-y-3">${renderResults(state.live, true)}</div>`
          : `<div class="text-3xl text-stone-600">Waiting for the host to start a question…</div>`;
        app.innerHTML = `
          <div class="min-h-screen flex flex-col p-8">
            <header class="flex items-center justify-between mb-8">
              <div class="flex items-center gap-3">
                ${state.branding.logo ? `<img src="${state.branding.logo}" class="h-16 object-contain" />` : ''}
                <div>
                  <div class="text-xl font-bold" style="color:${primary}">${name}</div>
                </div>
              </div>
            </header>
            <div class="flex-1 flex flex-col items-center justify-center text-center">
              ${liveHtml}
            </div>
            <div class="mt-8 text-center">
              <p class="text-sm text-stone-500 mb-2">Scan to answer · Join before time runs out</p>
              <img src="${qr}" class="mx-auto bg-white p-2 rounded-lg" width="140" height="140" alt="QR" />
            </div>
          </div>`;
        startPolling();
      } else if (state.view === 'audience') {
        const audHtml = state.live && state.live.active
          ? `<div class="text-xl font-semibold mb-2">${state.live.question}</div>
             <div class="text-sm text-stone-500 mb-6">${fmtTime(state.live.remaining)} left</div>
             <div class="space-y-3">${(state.live.type === 'yesno' ? ['Yes','No'] : ['1','2','3','4','5']).map(c =>
               `<button onclick="submitAnswer('${c}')" class="w-full py-3 rounded-xl text-white font-semibold" style="background:${primary}">${c}</button>`
             ).join('')}</div>`
          : `<div class="text-stone-600">Waiting for the host to start a question…</div>`;
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto">
            <h1 class="text-xl font-bold mb-6" style="color:${primary}">${name}</h1>
            <div id="aud">${audHtml}</div>
          </div>`;
        startPolling();
      }
    }

    function renderResults(live, large = false) {
      const results = live.results || {};
      const total = Object.values(results).reduce((a,b) => a + b, 0) || 1;
      const opts = live.type === 'yesno' ? ['Yes','No'] : Object.keys(results).length ? Object.keys(results) : ['1','2','3','4','5'];
      return opts.map(opt => {
        const count = results[opt] || 0;
        const pct = Math.round((count / total) * 100);
        return `<div>
          <div class="flex justify-between text-sm mb-1"><span>${opt}</span><span>${pct}%</span></div>
          <div class="h-2 bg-stone-200 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${state.branding.primary || '#1e3a5f'}"></div></div>
        </div>`;
      }).join('');
    }

    function renderQList() {
      if (!state.questions.length) return '<p class="text-stone-500 italic text-sm">No questions yet.</p>';
      return state.questions.map(q => `
        <div class="flex justify-between items-center p-3 rounded-xl bg-stone-50 border border-stone-200">
          <div>
            <div class="font-medium text-sm">${q.text}</div>
            <div class="text-xs text-stone-500">Used ${q.used || 0} times</div>
          </div>
          <button onclick="startQuestion(${q.id})" class="px-3 py-1.5 rounded-lg text-white text-xs" style="background:${state.branding.primary || '#1e3a5f'}">Start the timer</button>
        </div>`).join('');
    }

    async function startHost() {
      if (!state.hostCode) {
        const res = await api('/api/host', { method: 'POST', body: state.branding });
        state.hostCode = res.code;
        saveLocal();
      }
      await loadQuestions();
      state.view = 'host';
      render();
    }

    function joinAudience() {
      const code = new URLSearchParams(location.search).get('join') || prompt('Enter host code:');
      if (code) { state.hostCode = code.toUpperCase(); state.view = 'audience'; render(); }
    }

    function openProjector() { window.open(`/?projector=1&code=${state.hostCode}`, '_blank'); }

    async function addQuestion() {
      const text = prompt('Question text:');
      if (!text) return;
      const type = prompt('Type: yesno or scale', 'yesno');
      await api(`/api/host/${state.hostCode}/questions`, { method: 'POST', body: { text, type } });
      await loadQuestions();
      render();
    }

    async function startQuestion(qid) {
      try {
        await api('/api/session', { method: 'POST', body: { host: state.hostCode, question_id: qid, duration: 180 } });
        state.statusMsg = 'Timer started — projector and phones will update.';
        await loadQuestions();
        render();
        setTimeout(() => { state.statusMsg = ''; render(); }, 4000);
      } catch { state.statusMsg = 'Could not start question.'; render(); }
    }

    async function submitAnswer(choice) {
      if (!state.live || !state.live.session_id) return;
      try {
        await api('/api/answer', { method: 'POST', body: { session_id: state.live.session_id, choice } });
        document.getElementById('aud').innerHTML = '<p class="text-green-700 font-medium">Answer recorded. Thanks!</p>';
      } catch {}
    }

    let pollTimer;
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (!state.hostCode) return;
        try {
          const live = await api(`/api/host/${state.hostCode}/current`);
          if (JSON.stringify(live) !== JSON.stringify(state.live)) {
            state.live = live;
            render();
          }
        } catch {}
      }, 2000);
    }

    function editBranding() {
      const name = prompt('Room name:', state.branding.name);
      if (name !== null && name.trim()) state.branding.name = name.trim();

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999';
      overlay.innerHTML = `
        <div class="bg-white p-8 rounded-2xl text-center max-w-sm mx-4 shadow-xl">
          <p class="text-lg mb-6">Upload your company logo to change the theme</p>
          <button id="uploadBtn" class="px-6 py-3 rounded-xl text-white font-semibold" style="background:${state.branding.primary || '#1e3a5f'}">Upload</button>
          <button id="skipBtn" class="ml-3 px-6 py-3 rounded-xl bg-stone-200">Skip</button>
        </div>`;
      document.body.appendChild(overlay);

      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';

      document.getElementById('uploadBtn').onclick = () => input.click();
      document.getElementById('skipBtn').onclick = () => { document.body.removeChild(overlay); saveAndRefresh(); };

      input.onchange = (e) => {
        const file = e.target.files[0];
        document.body.removeChild(overlay);
        if (!file) { saveAndRefresh(); return; }
        const reader = new FileReader();
        reader.onload = () => {
          state.branding.logo = reader.result;
          getDominantColor(reader.result, (color) => {
            state.branding.primary = color;
            saveAndRefresh();
          });
        };
        reader.readAsDataURL(file);
      };
      document.body.appendChild(input);

      function saveAndRefresh() {
        saveLocal();
        api(`/api/host/${state.hostCode}/branding`, { method: 'POST', body: state.branding }).finally(() => render());
      }
    }

    const params = new URLSearchParams(location.search);
    if (params.get('projector')) { state.hostCode = params.get('code') || ''; state.view = 'projector'; }
    else if (params.get('join')) { state.hostCode = params.get('join'); state.view = 'audience'; }
    render();
  </script>
</body>
</html>
