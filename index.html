<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="app" class="min-h-screen"></div>
  <script>
    const API = window.location.origin;
    let state = {
      view: 'home',
      hostCode: localStorage.getItem('hostCode') || '',
      branding: JSON.parse(localStorage.getItem('branding') || '{"name":"Live Room","primary":"#3b82f6","logo":""}'),
      questions: [],
      activeSession: null
    };

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function saveLocal() {
      localStorage.setItem('hostCode', state.hostCode);
      localStorage.setItem('branding', JSON.stringify(state.branding));
    }

    async function loadQuestions() {
      if (!state.hostCode) return;
      try {
        state.questions = await api(`/api/host/${state.hostCode}/questions`);
      } catch (e) {
        console.error(e);
        state.questions = [];
      }
    }

    function render() {
      const app = document.getElementById('app');
      const primary = state.branding.primary || '#3b82f6';

      if (state.view === 'home') {
        app.innerHTML = `
          <div class="max-w-md mx-auto p-8 text-center">
            <h1 class="text-4xl font-bold mb-2" style="color:${primary}">Live Room</h1>
            <p class="mb-8 text-slate-400">Ask one question. See the room answer.</p>
            <div class="space-y-3">
              <button onclick="startHost()" class="w-full py-3 rounded-xl text-white font-semibold" style="background:${primary}">Host a room</button>
              <button onclick="joinAudience()" class="w-full py-3 rounded-xl border-2 font-semibold" style="border-color:${primary};color:${primary}">Join with code</button>
            </div>
          </div>`;
      } else if (state.view === 'host') {
        app.innerHTML = `
          <div class="max-w-3xl mx-auto p-6">
            <header class="flex items-center justify-between mb-8">
              <div>
                <h1 class="text-2xl font-bold" style="color:${primary}">${state.branding.name}</h1>
                <p class="text-sm text-slate-400">Host code: <span class="font-mono font-bold">${state.hostCode}</span></p>
              </div>
              <div class="flex gap-2">
                <button onclick="openProjector()" class="px-4 py-2 rounded-lg bg-slate-700">Projector</button>
                <button onclick="editBranding()" class="px-4 py-2 rounded-lg text-white" style="background:${primary}">Branding</button>
              </div>
            </header>
            <section>
              <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold">Question library</h2>
                <button onclick="addQuestion()" class="px-3 py-1.5 rounded-lg text-white text-sm" style="background:${primary}">+ Add</button>
              </div>
              <div class="space-y-2">${renderQList()}</div>
            </section>
            <div class="mt-8 p-4 bg-slate-800 rounded-xl border border-slate-700 text-center">
              <p class="text-sm text-slate-400 mb-3">Audience link / QR code</p>
              <canvas id="qr" class="mx-auto bg-white p-2 rounded"></canvas>
              <p class="mt-3 font-mono text-sm break-all">${window.location.origin}/?join=${state.hostCode}</p>
            </div>
          </div>`;
        setTimeout(() => {
          const canvas = document.getElementById('qr');
          if (canvas && window.QRCode) {
            QRCode.toCanvas(canvas, `${window.location.origin}/?join=${state.hostCode}`, { width: 180, margin: 1 });
          }
        }, 100);
      } else if (state.view === 'projector') {
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-8 text-center text-white" style="background:${primary}">
            ${state.branding.logo ? `<img src="${state.branding.logo}" class="h-24 mb-6 object-contain bg-white/10 rounded-xl p-2" />` : ''}
            <h1 class="text-5xl font-bold mb-8">${state.branding.name}</h1>
            <div id="live" class="text-3xl max-w-3xl">Waiting for the host to start a question…</div>
          </div>`;
        pollLive();
      } else if (state.view === 'audience') {
        app.innerHTML = `
          <div class="max-w-md mx-auto p-6 text-center">
            <h1 class="text-2xl font-bold mb-4" style="color:${primary}">Answer</h1>
            <div id="aud">Waiting for the host to start a question…</div>
          </div>`;
        pollLive();
      }
    }

    function renderQList() {
      if (!state.questions.length) return '<p class="text-slate-500 italic">No questions yet.</p>';
      return state.questions.map(q => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center">
          <div>
            <div class="font-medium">${q.text}</div>
            <div class="text-xs text-slate-400">Used ${q.used || 0} times</div>
          </div>
          <button onclick="startQuestion(${q.id})" class="px-4 py-1.5 rounded-lg text-white text-sm" style="background:${state.branding.primary || '#3b82f6'}">Start timer</button>
        </div>`).join('');
    }

    async function startHost() {
      if (!state.hostCode) {
        const res = await api('/api/host', { method: 'POST', body: state.branding });
        state.hostCode = res.code;
        saveLocal();
      }
      await loadQuestions();
      state.view = 'host';
      render();
    }

    function joinAudience() {
      const code = new URLSearchParams(location.search).get('join') || prompt('Enter host code:');
      if (code) {
        state.hostCode = code.toUpperCase();
        state.view = 'audience';
        render();
      }
    }

    function openProjector() {
      window.open(`/?projector=1&code=${state.hostCode}`, '_blank');
    }

    async function addQuestion() {
      const text = prompt('Question text:');
      if (!text) return;
      const type = prompt('Type: yesno, scale, or custom', 'yesno');
      await api(`/api/host/${state.hostCode}/questions`, { method: 'POST', body: { text, type } });
      await loadQuestions();
      render();
    }

    async function startQuestion(qid) {
      try {
        const res = await api('/api/session', { method: 'POST', body: { host: state.hostCode, question_id: qid, duration: 180 } });
        alert('Timer started! Projector and audience devices will update.');
        await loadQuestions();
        render();
      } catch (e) {
        alert('Could not start question. Check that the server is running.');
        console.error(e);
      }
    }

    function editBranding() {
      const name = prompt('Room name:', state.branding.name);
      const logo = prompt('Logo URL (optional):', state.branding.logo || '');
      const color = prompt('Primary color (hex, e.g. #3b82f6):', state.branding.primary);
      if (name) state.branding.name = name;
      if (logo !== null) state.branding.logo = logo;
      if (color) state.branding.primary = color;
      saveLocal();
      api(`/api/host/${state.hostCode}/branding`, { method: 'POST', body: state.branding }).catch(() => {});
      render();
    }

    async function pollLive() {
      if (!state.hostCode) return;
      setInterval(async () => {
        // placeholder
      }, 2000);
    }

    const params = new URLSearchParams(location.search);
    if (params.get('projector')) {
      state.hostCode = params.get('code') || '';
      state.view = 'projector';
    } else if (params.get('join')) {
      state.hostCode = params.get('join');
      state.view = 'audience';
    }
    render();
  </script>
</body>
</html>
